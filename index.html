<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>葉山 清掃チェックリスト</title>

<style>
:root {
  --bg: #F5F3EE;
  --surface: #FDFCFA;
  --surface2: #EDE9E1;
  --border: #DDD8CE;
  --border2: #C8C2B6;
  --text: #1C1915;
  --text2: #6B6459;
  --text3: #A89F94;
  --accent: #2A3D2E;
  --accent2: #8B7355;
  --accent-light: #EAF0EB;
  --accent-text: #1A3D2E;
  --warn: #8B3A2A;
  --warn-light: #F5EAE7;
  --warn-text: #5C2218;
  --gold: #8B7355;
  --gold-light: #F5F0E8;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 4px rgba(28,25,21,0.08);
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Noto Sans JP', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--bg); font-family: var(--sans); color: var(--text); }

/* layout */
.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; }

/* header */
.header { background: var(--text); padding: 0 16px; flex-shrink: 0; }
.header-hero { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; border-bottom: 1px solid rgba(255,255,255,0.12); }
.header-hero-img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 1.5px solid rgba(255,255,255,0.25); flex-shrink: 0; }
.header-hero-text { flex: 1; }
.header-eyebrow { font-size: 9px; letter-spacing: .18em; color: rgba(255,255,255,0.45); text-transform: uppercase; font-family: var(--sans); margin-bottom: 3px; }
.header-title { font-family: var(--serif); font-size: 18px; font-weight: 500; color: #fff; letter-spacing: .04em; line-height: 1.2; }
.header-date { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; letter-spacing: .06em; }
.mode-bar { display: flex; gap: 1px; padding: 10px 0; }
.mode-btn { flex: 1; padding: 8px; border: none; background: transparent; font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.4); cursor: pointer; transition: all .15s; font-family: var(--sans); letter-spacing: .1em; text-transform: uppercase; border-bottom: 1.5px solid transparent; }
.mode-btn.active { color: #fff; border-bottom-color: var(--accent2); }

.scroll-area { padding: 16px 16px 80px; }

/* prop tabs */
.prop-tabs { display: flex; gap: 5px; margin-bottom: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.prop-tabs::-webkit-scrollbar { display: none; }
.prop-tab { flex-shrink: 0; padding: 6px 14px; border: 1px solid var(--border); border-radius: 100px; font-size: 11px; font-weight: 400; color: var(--text2); background: var(--surface); cursor: pointer; white-space: nowrap; transition: all .15s; font-family: var(--sans); letter-spacing: .04em; }
.prop-tab.active { background: var(--text); color: #fff; border-color: var(--text); }
.prop-tab.done { border-color: var(--accent); color: var(--accent-text); background: var(--accent-light); }

/* sub nav */
.sub-nav { display: flex; background: var(--surface2); border-radius: var(--radius); padding: 3px; margin-bottom: 14px; gap: 2px; }
.sub-btn { flex: 1; padding: 8px 4px; border: none; background: transparent; border-radius: 8px; font-size: 10px; font-weight: 400; color: var(--text3); cursor: pointer; transition: all .15s; font-family: var(--sans); white-space: nowrap; letter-spacing: .05em; }
.sub-btn.active { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: var(--shadow); }

/* area selector */
.area-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.area-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 100px; font-size: 11px; font-weight: 400; color: var(--text2); background: var(--surface); cursor: pointer; transition: all .15s; font-family: var(--sans); letter-spacing: .03em; }
.area-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
.area-btn.done { border-color: var(--accent); color: var(--accent-text); background: var(--accent-light); }

/* progress */
.prog-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.prog-bar-wrap { flex: 1; height: 2px; background: var(--border); border-radius: 100px; overflow: hidden; }
.prog-bar-fill { height: 2px; background: var(--accent2); border-radius: 100px; transition: width .4s ease; }
.prog-label { font-size: 10px; color: var(--text3); white-space: nowrap; letter-spacing: .06em; }

/* check items */
.sec-label { font-size: 9px; font-weight: 400; color: var(--text3); letter-spacing: .14em; text-transform: uppercase; margin: 14px 0 8px 2px; font-family: var(--sans); }
.ci { display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 5px; cursor: pointer; transition: all .15s; }
.ci:active { opacity: .85; }
.ci.done { background: var(--surface2); border-color: var(--border); }
.cb { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
.cb.chk { background: var(--accent); border-color: var(--accent); }
.cb.chk::after { content: ''; width: 9px; height: 5px; border-left: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(-45deg) translate(1px,-1px); display: block; }
.cl { font-size: 13px; color: var(--text); flex: 1; line-height: 1.6; font-weight: 300; }
.ci.done .cl { color: var(--text3); text-decoration: line-through; }

/* issues */
.issue-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.issue-prop-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); margin-bottom: 6px; }
.issue-notice { background: var(--gold-light); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 13px 14px; margin-bottom: 10px; }
.issue-notice-hd { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent2); margin-bottom: 6px; }
.issue-notice-text { font-size: 13px; color: var(--text); line-height: 1.7; font-weight: 300; white-space: pre-wrap; }
.issue-reply { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px 14px; }
.issue-reply-hd { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
.issue-empty { text-align:center; padding: 40px 20px; color: var(--text3); font-size: 13px; font-weight: 300; letter-spacing: .04em; }

/* hq notice editor */
.notice-editor { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
.notice-editor-hd { font-family: var(--serif); font-size: 15px; color: var(--text); margin-bottom: 12px; letter-spacing: .02em; }
.notice-prop-select { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 12px; }
.notice-prop-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: 100px; font-size: 11px; color: var(--text2); background: var(--bg); cursor: pointer; font-family: var(--sans); transition: all .15s; }
.notice-prop-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
.save-notice-btn { width: 100%; padding: 12px; background: var(--accent2); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 11px; font-weight: 400; cursor: pointer; font-family: var(--sans); letter-spacing: .1em; text-transform: uppercase; margin-top: 8px; }

/* pages */
.page { display: none; }
.page.active { display: block; }
.screen { display: none; }
.screen.active { display: block; }


/* notice box */
.notice { background: var(--gold-light); border: 1px solid var(--border2); border-radius: var(--radius); padding: 13px 15px; font-size: 12px; color: var(--text2); line-height: 1.8; margin-bottom: 14px; white-space: pre-line; font-weight: 300; }

/* submit */
.submit-notice { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 14px; font-weight: 300; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
.ph-item { border: 1px dashed var(--border2); border-radius: var(--radius-sm); padding: 14px 6px; text-align: center; font-size: 11px; color: var(--text3); cursor: pointer; background: var(--surface); transition: all .15s; line-height: 1.5; font-weight: 300; }
.ph-item.done { border-style: solid; border-color: var(--accent); color: var(--accent-text); background: var(--accent-light); }
.ph-icon { font-size: 18px; display: block; margin: 0 auto 4px; }
.txt-area { width: 100%; font-size: 13px; padding: 11px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); resize: none; font-family: var(--sans); margin-bottom: 8px; line-height: 1.6; font-weight: 300; }
.txt-area:focus { outline: none; border-color: var(--accent2); }
.submit-btn { width: 100%; padding: 15px; background: var(--text); color: #fff; border: none; border-radius: var(--radius); font-size: 12px; font-weight: 400; cursor: pointer; transition: all .15s; font-family: var(--sans); letter-spacing: .12em; text-transform: uppercase; }
.submit-btn:active { opacity: .85; }
.submit-btn.sent { background: #888; cursor: default; }
.submit-btn:disabled { opacity: .35; cursor: default; }

/* start screen */
.start-prop-btn { width:100%; padding:16px 18px; border:1px solid var(--border); border-radius:var(--radius); font-size:13px; font-weight:300; color:var(--text); background:var(--surface); cursor:pointer; text-align:left; transition:all .15s; font-family:var(--sans); letter-spacing:.04em; }
.start-prop-btn:active { opacity:.85; }
.start-prop-btn.selected { border-color:var(--text); background:var(--text); color:#fff; }
input[type="text"], input[type="date"] { outline:none; font-weight:300; }
input[type="text"]:focus, input[type="date"]:focus { border-color:var(--accent2) !important; }

/* HQ */
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.mc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.ml { font-size: 9px; color: var(--text3); margin-bottom: 4px; font-weight: 400; letter-spacing: .1em; text-transform: uppercase; }
.mv { font-size: 22px; font-weight: 400; color: var(--text); font-family: var(--serif); }
.mv.g { color: var(--accent); }
.mv.r { color: var(--warn); }
.prop-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; }
.prop-card-hd { display: flex; align-items: center; gap: 8px; padding: 13px 14px; cursor: pointer; }
.prop-card-name { font-size: 13px; font-weight: 400; color: var(--text); flex: 1; letter-spacing: .04em; font-family: var(--serif); font-size: 15px; }
.prop-card-body { border-top: 1px solid var(--border); padding: 12px 14px; display: none; }
.prop-card-body.open { display: block; }
.area-rpt-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.area-rpt-row:last-child { border-bottom: none; }
.area-rpt-name { font-size: 12px; color: var(--text); flex: 1; font-weight: 300; }
.mini-bar { flex: 0 0 70px; height: 2px; background: var(--border); border-radius: 100px; overflow: hidden; }
.mini-fill { height: 2px; background: var(--accent2); border-radius: 100px; }
.area-rpt-pct { font-size: 11px; color: var(--text3); min-width: 32px; text-align: right; font-family: var(--serif); }
.flag-section { margin-top: 10px; }
.flag-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--border); }
.flag-row:last-child { border-bottom: none; }
.flag-row-text { font-size: 12px; color: var(--warn-text); flex: 1; line-height: 1.4; font-weight: 300; }

.memo-section { margin-top: 10px; padding: 10px 12px; background: var(--surface2); border-radius: var(--radius-sm); }

/* badge */
.badge { font-size: 10px; padding: 3px 9px; border-radius: 100px; font-weight: 400; white-space: nowrap; letter-spacing: .06em; }
.badge-done { background: var(--accent-light); color: var(--accent-text); border: 1px solid var(--accent); }
.badge-warn { background: var(--warn-light); color: var(--warn-text); border: 1px solid #DDB8AE; }
.badge-prog { background: var(--gold-light); color: var(--gold); border: 1px solid var(--border2); }
.badge-none { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }

/* trouble */
.tr-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; overflow: hidden; }
.tr-hd { display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer; }
.tr-title { font-size: 13px; font-weight: 400; color: var(--text); flex: 1; letter-spacing: .02em; }
.tr-body { padding: 0 14px 12px; display: none; }
.tr-body.open { display: block; }
.step { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
.step-n { width: 20px; height: 20px; background: var(--surface2); color: var(--text2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; flex-shrink: 0; font-family: var(--serif); }
.step-t { font-size: 13px; color: var(--text2); line-height: 1.5; padding-top: 2px; font-weight: 300; }
.contact-row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 5px; }
.contact-name { font-size: 13px; color: var(--text); flex: 1; font-weight: 300; }
.contact-tel { font-size: 13px; color: var(--accent2); font-weight: 500; }
.contact-icon { font-size: 16px; flex-shrink: 0; }

/* empty state */
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; font-weight: 300; }
.empty-icon { font-size: 32px; display: block; margin: 0 auto 12px; }

/* divider */

/* chev */

.chev.open { transform: rotate(180deg); }

/* scrollbar */
::-webkit-scrollbar { width: 3px; }

.start-prop-btn { width:100%; padding:16px; border:1.5px solid var(--border); border-radius:var(--radius); font-size:15px; font-weight:700; color:var(--text); background:var(--surface); cursor:pointer; text-align:left; transition:all .15s; font-family:inherit; }
.start-prop-btn:active { transform:scale(.99); }
.start-prop-btn.selected { border-color:var(--accent); background:var(--accent-light); color:var(--accent-text); }
input[type="text"], input[type="date"] { outline:none; }
input[type="text"]:focus, input[type="date"]:focus { border-color:var(--accent); }

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-hero">
      <img class="header-hero-img" src="hero.jpg" alt="THE HOUSE" id="header-img" onerror="this.style.display='none'">
      <div class="header-hero-text">
        <div class="header-eyebrow">THE HOUSE — CLEANING STAFF</div>
        <div class="header-title">清掃チェックリスト</div>
        <div class="header-date" id="date-lbl"></div>
      </div>
    </div>
    <div class="mode-bar">
      <button class="mode-btn active" onclick="setMode('staff')">Staff</button>
      <button class="mode-btn" onclick="setMode('hq')">Headquarters</button>
    </div>
  </div>

  <div class="scroll-area" id="scroll-area">

    <!-- ===== STAFF MODE ===== -->
    <div id="mode-staff" class="page active">

      <!-- START SCREEN -->
      <div id="sscreen-start" style="display:block;">
        <div style="padding: 0 0 20px;">
          <div style="margin-bottom:16px;">
            <div style="font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;">Facility</div>
            <div style="font-family:var(--serif);font-size:20px;color:var(--text);font-weight:400;letter-spacing:.02em;line-height:1.3;">ご担当の施設を<br>お選びください</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;">
            <button class="start-prop-btn" onclick="selectStartProp('beach')">THE HOUSE on the beach</button>
            <button class="start-prop-btn" onclick="selectStartProp('hayama')">THE HOUSE 葉山</button>
            <button class="start-prop-btn" onclick="selectStartProp('shiro')">MAISON D:E VACANCES 城ヶ島</button>
            <button class="start-prop-btn" onclick="selectStartProp('koajiroBB')">THE HOUSE 小網代 Bed and Bath</button>
            <button class="start-prop-btn" onclick="selectStartProp('koajiroSLS')">THE HOUSE 小網代 Shower Living Suite</button>
            <button class="start-prop-btn" onclick="selectStartProp('koajiroPC')">THE HOUSE 小網代 Pool and Cave</button>
            <button class="start-prop-btn" onclick="selectStartProp('moroso')">THE HOUSE 諸磯</button>
          </div>
          <div id="start-form" style="display:none;">
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;">
              <div style="margin-bottom:14px;">
                <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;">Staff Name</div>
                <input type="text" id="staff-name-input" placeholder="スタッフ名を入力" style="width:100%;font-size:15px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;">
              </div>
              <div>
                <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;">Date</div>
                <input type="date" id="staff-date-input" style="width:100%;font-size:15px;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300;">
              </div>
            </div>
            <button class="submit-btn" onclick="startChecklist()" id="start-btn">Begin Checklist</button>
          </div>
        </div>
      </div>

      <!-- CHECKLIST SCREEN -->
      <div id="sscreen-check" style="display:none;">
      <div class="prop-tabs" id="prop-tabs"></div>
      <div style="background:var(--surface2);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;">
        <span style="font-family:var(--serif);font-size:15px;font-weight:500;color:var(--text);flex:1;letter-spacing:.03em;" id="staff-info-bar">　</span>
        <button onclick="resetStart()" style="font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 6px;letter-spacing:.08em;text-transform:uppercase;">変更</button>
      </div>
      <!-- 現在の施設名 -->
      <div id="current-prop-label" style="font-family:var(--serif);font-size:18px;font-weight:500;color:var(--text);letter-spacing:.04em;margin-bottom:12px;padding-left:2px;"></div>
      <div class="sub-nav">
        <button class="sub-btn active" onclick="staffNav('check')">Check</button>
        <button class="sub-btn" onclick="staffNav('issues')">Issues</button>
        <button class="sub-btn" onclick="staffNav('submit')">Report</button>
        <button class="sub-btn" onclick="staffNav('trouble')">Trouble</button>
      </div>

      <!-- CHECK PAGE -->
      <div id="spage-check" style="display:block;">
        <div class="area-row" id="area-row"></div>
        <div class="prog-row">
          <div class="prog-bar-wrap"><div class="prog-bar-fill" id="prog-fill" style="width:0%"></div></div>
          <div class="prog-label" id="prog-lbl">0 / 0</div>
        </div>
        <div id="check-items"></div>
        <div id="check-submit-wrap" style="display:none;margin-top:16px;">
          <div style="height:1px;background:var(--border);margin-bottom:16px;"></div>
          <button class="submit-btn" id="check-submit-btn" onclick="goToReport()">本部へ清掃完了報告 →</button>
          <p style="text-align:center;font-size:12px;color:var(--text3);margin-top:10px;letter-spacing:.04em;">📷 写真はメッセンジャーに報告ください。</p>
          <div id="check-done-wrap" style="display:none;margin-top:10px;">
            <div style="background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius);padding:20px 16px;text-align:center;">
              <div style="font-family:var(--serif);font-size:32px;color:var(--accent);margin-bottom:8px;">✓</div>
              <div style="font-family:var(--serif);font-size:15px;font-weight:500;color:var(--accent-text);letter-spacing:.04em;" id="check-done-msg"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ISSUES PAGE -->
      <div id="spage-issues" style="display:none;">
        <div id="issues-content"></div>
      </div>

      <!-- SUBMIT PAGE -->
      <div id="spage-submit" style="display:none;">
        <div class="submit-notice" id="submit-notice"></div>
        <div class="sec-label">補充が必要なもの</div>
        <textarea class="txt-area" id="supply-txt" rows="2" placeholder="例：ティッシュ、アメニティ"></textarea>
        <div class="sec-label">修繕・メンテナンス報告</div>
        <textarea class="txt-area" id="maint-txt" rows="2" placeholder="修繕が必要な箇所など"></textarea>
        <div class="sec-label">その他メモ</div>
        <textarea class="txt-area" id="memo-txt" rows="2" placeholder="自由記入"></textarea>
        <button class="submit-btn" id="submit-btn" onclick="submitReport()">本部へ清掃完了報告</button>
        <p style="text-align:center;font-size:12px;color:var(--text3);margin-top:10px;letter-spacing:.04em;">📷 写真はメッセンジャーに報告ください。</p>
        <div id="finish-done-wrap" style="display:none;margin-top:10px;">
          <div style="background:var(--accent-light);border:1px solid var(--accent);border-radius:var(--radius);padding:20px 16px;text-align:center;">
            <div style="font-family:var(--serif);font-size:32px;color:var(--accent);margin-bottom:8px;">✓</div>
            <div style="font-family:var(--serif);font-size:15px;font-weight:500;color:var(--accent-text);letter-spacing:.04em;" id="finish-done-msg"></div>
          </div>
        </div>
      </div>

      <!-- TROUBLE PAGE -->
      <div id="spage-trouble" style="display:none;">
        <div id="trouble-content"></div>
        <div class="sec-label" style="margin-top:14px">📞 緊急連絡先</div>
        <div class="contact-row"><span class="contact-icon">🔥</span><span class="contact-name">ガス — 岡田さん</span><span class="contact-tel">090-5527-5352</span></div>
        <div class="contact-row"><span class="contact-icon">⚡</span><span class="contact-name">電気 — 大幸さん</span><span class="contact-tel">090-3224-2084</span></div>
        <div class="contact-row"><span class="contact-icon">✨</span><span class="contact-name">クリーニング — 宮崎さん</span><span class="contact-tel"></span></div>
        <div class="contact-row"><span class="contact-icon">❄️</span><span class="contact-name">エアコン — ダイキン</span><span class="contact-tel">0120-881-081</span></div>
      </div>
      </div><!-- /sscreen-check -->
    </div>

    <!-- ===== HQ MODE ===== -->
    <div id="mode-hq" class="page">
      <div class="metrics">
        <div class="mc"><div class="ml">送信済み</div><div class="mv g" id="hq-sent">0/3</div></div>
        <div class="mc"><div class="ml">全体進捗</div><div class="mv" id="hq-prog">0%</div></div>
        <div class="mc"><div class="ml">完了施設</div><div class="mv g" id="hq-flags">0</div></div>
      </div>

      <!-- 特記事項エディター -->
      <div class="notice-editor">
        <div class="notice-editor-hd">特記事項を書き込む</div>
        <div class="notice-prop-select" id="notice-prop-select"></div>
        <textarea class="txt-area" id="notice-txt" rows="3" placeholder="スタッフへの連絡・注意事項を入力..."></textarea>
        <button class="save-notice-btn" onclick="saveNotice()">施設へ送信</button>
      </div>

      <!-- 既存の特記事項一覧 -->
      <div id="notice-list"></div>

      <div class="divider"></div>
      <div id="hq-cards"></div>
    </div>

  </div><!-- /scroll-area -->
</div><!-- /app -->

function P(id){ return PROPS.find(p=>p.id===(id||curProp)); }

let staffName = '';

function startChecklist() {
  const name = document.getElementById('staff-name-input').value.trim();

// STAFF NAV
function staffNav(tab){
  curNav = tab;
  document.querySelectorAll('.sub-btn').forEach((b,i)=>b.classList.toggle('active',['check','issues','submit','trouble'][i]===tab));
  ['check','issues','submit','trouble'].forEach(t=>{
    document.getElementById('spage-'+t).style.display = (t===tab)?'block':'none';
  });

  document.getElementById('scroll-area').scrollTop = 0;

function renderByNav(){
  if(curNav==='check') renderCheck();
  else if(curNav==='issues') renderIssues();
  else if(curNav==='submit') renderSubmit();
  else if(curNav==='trouble') renderTrouble();
}

// CHECK
function renderCheck(){
  const prop = P();
  const lbl = document.getElementById('current-prop-label');
  if(lbl) lbl.textContent = prop.name;
  document.getElementById('area-row').innerHTML = prop.areas.map(a=>{
    const chkd = S[curProp].checked[a.id]||{};
    const reqDone = a.items.filter((it,i)=>!it.o && chkd[i]).length;
    const reqTotal = a.items.filter(it=>!it.o).length;
    const isDone = reqTotal > 0 && reqDone === reqTotal;
    return`<button class="area-btn${curArea===a.id?' active':''}${isDone?' done':''}" onclick="selArea('${a.id}')">${a.name}${isDone?' ✓':''}</button>`;
  }).join('');
  const area = prop.areas.find(a=>a.id===curArea);
  const requiredItems = area.items.filter(item => !item.o);
  const doneRequired = area.items.reduce((s,item,i) => s + ((!item.o && S[curProp].checked[curArea][i]) ? 1 : 0), 0);
  const done = Object.values(S[curProp].checked[curArea]||{}).filter(Boolean).length;
  const total = area.items.length;
  const reqTotal = requiredItems.length;
  document.getElementById('prog-fill').style.width = Math.round(done/total*100)+'%';
  document.getElementById('prog-lbl').textContent = done+' / '+total+' 完了（必須 '+doneRequired+'/'+reqTotal+'）';
  document.getElementById('check-items').innerHTML = area.items.map((item,i)=>{
    const text = item.t;
    const chk = S[curProp].checked[curArea][i];
    const isRed = item.r;
    const hasPhoto = item.p;
    const isOptional = item.o;
    const label = (isRed ? `<span style="color:var(--warn);font-weight:500">${text}</span>` : text)
      + (hasPhoto ? ' <span style="font-size:13px" title="写真報告が必要">📷</span>' : '');
    return`<div class="ci${chk?' done':''}" onclick="toggleCheck(${i})">
      <div class="cb${chk?' chk':''}"></div>
      <div class="cl">${label}${isOptional?'<span style="font-size:10px;color:var(--text3);margin-left:6px;letter-spacing:.04em;">任意</span>':''}</div>
    </div>`;
  }).join('');
  updateCheckSubmitBtn();
}
function selArea(id){ curArea=id; renderCheck(); }
function toggleCheck(i){ S[curProp].checked[curArea][i]=!S[curProp].checked[curArea][i]; renderCheck(); updateCheckSubmitBtn(); }

function updateCheckSubmitBtn(){
  const prop = P();
  const ps = S[curProp];
  const reqTotal = prop.areas.reduce((s,a)=>s+a.items.filter(it=>!it.o).length,0);
  const reqDone = prop.areas.reduce((s,a)=>s+a.items.filter((it,i)=>!it.o&&(ps.checked[a.id]||{})[i]).length,0);
  const allReqDone = reqDone >= reqTotal;
  const wrap = document.getElementById('check-submit-wrap');
  if(!wrap) return;
  if(ps.submitted){
    wrap.style.display = 'block';
    document.getElementById('check-submit-btn').style.display = 'none';
    document.getElementById('check-done-wrap').style.display = 'block';
    document.getElementById('check-done-msg').innerHTML = ps.submittedAt+'　業務完了報告済み<br><span style="font-size:13px;font-weight:300;line-height:1.8;display:block;margin-top:6px;">これでお客様も快適にお過ごしいただけます。<br>いつもありがとう！お疲れ様でした！🙏</span><span style="font-size:12px;font-weight:300;color:var(--text2);line-height:1.7;display:block;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.1);">📷 撮影写真はいつものメッセンジャーに必ず投稿ください。<br>それで清掃完了になります。</span>';
  } else if(allReqDone){
    wrap.style.display = 'block';
    document.getElementById('check-submit-btn').style.display = 'block';
    document.getElementById('check-submit-btn').textContent = '本部へ清掃完了報告 →';
    document.getElementById('check-done-wrap').style.display = 'none';
  } else {
    wrap.style.display = 'none';
  }
}

}

// ISSUES — 本部特記事項 + スタッフ対応メモ
function renderIssues(){
  const el = document.getElementById('issues-content');
  const n = notices[curProp];
  if(!n.text){
    el.innerHTML=`<div class="issue-empty">
      <div style="font-family:var(--serif);font-size:28px;color:var(--border2);margin-bottom:10px;">—</div>
      本部からの特記事項はありません
    </div>`;
    return;
  }
  const repliesHtml = n.replies.length ? n.replies.map(r=>`
    <div style="padding:8px 0;border-bottom:1px solid var(--border);">
      <div style="font-size:10px;color:var(--text3);letter-spacing:.06em;margin-bottom:4px;">${r.name}　${r.time}</div>
      <div style="font-size:13px;color:var(--text);font-weight:300;line-height:1.6;">${r.text}</div>
    </div>`).join('') : `<div style="font-size:12px;color:var(--text3);font-weight:300;padding:6px 0;">まだ返信はありません</div>`;
  el.innerHTML=`
    <div class="issue-notice">
      <div class="issue-notice-hd">本部からの特記事項</div>
      <div class="issue-notice-text">${n.text}</div>
    </div>
    <div class="issue-reply">
      <div class="issue-reply-hd">対応メモ</div>
      ${repliesHtml}
      <textarea class="txt-area" id="reply-txt" rows="2" placeholder="対応内容を入力..." style="margin-top:10px;margin-bottom:6px;"></textarea>
      <button onclick="submitReply()" style="width:100%;padding:11px;background:var(--text);color:#fff;border:none;border-radius:var(--radius-sm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:var(--sans);">返信する</button>
    </div>`;
}
function submitReply(){
  const txt = document.getElementById('reply-txt').value.trim();
  if(!txt) return;
  const now = new Date();
  const time = now.getHours()+'時'+String(now.getMinutes()).padStart(2,'0')+'分';
  notices[curProp].replies.push({ name: staffName||'スタッフ', text: txt, time });
  renderIssues();
}

// SUBMIT
function renderSubmit(){
  const prop = P();
  const ps = S[curProp];
  const total = prop.areas.reduce((s,a)=>s+a.items.length,0);
  const done = prop.areas.reduce((s,a)=>s+Object.values(ps.checked[a.id]||{}).filter(Boolean).length,0);
  const reqTotal = prop.areas.reduce((s,a)=>s+a.items.filter(it=>!it.o).length,0);
  const reqDone = prop.areas.reduce((s,a)=>s+a.items.filter((it,i)=>!it.o&&(ps.checked[a.id]||{})[i]).length,0);
  const allReqDone = reqDone >= reqTotal;
  const dateStr = staffDate ? new Date(staffDate).toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'}) : '';
  document.getElementById('submit-notice').innerHTML =
    `<strong>${prop.name}</strong>　${dateStr}　${staffName}<br>必須チェック ${reqDone}/${reqTotal}件完了<br>
    <span style="font-size:11px;color:#888">必須項目を全てチェックしてから送信してください。写真はメッセンジャーへ。</span>`;
  document.getElementById('supply-txt').value = ps.supply||'';
  document.getElementById('maint-txt').value = ps.maint||'';
  document.getElementById('memo-txt').value = ps.memo||'';
  const btn = document.getElementById('submit-btn');
  const doneWrap = document.getElementById('finish-done-wrap');
  if(ps.submitted){
    btn.style.display = 'none';
    doneWrap.style.display = 'block';
    document.getElementById('finish-done-msg').innerHTML = ps.submittedAt + '　業務完了報告済み<br><span style="font-size:13px;font-weight:300;color:var(--accent-text);line-height:1.8;display:block;margin-top:8px;">これでお客様も快適にお過ごしいただけます。<br>いつもありがとう！お疲れ様でした！🙏</span><span style="font-size:12px;font-weight:300;color:var(--text2);line-height:1.7;display:block;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">📷 撮影写真はいつものメッセンジャーに必ず投稿ください。<br>それで清掃完了になります。</span>';
  } else {
    btn.style.display = 'block';
    btn.textContent = allReqDone ? '本部へ清掃完了報告' : `必須項目が残っています（${reqTotal-reqDone}件）`;
    btn.disabled = !allReqDone;
    btn.style.opacity = allReqDone ? '1' : '0.4';
    btn.style.cursor = allReqDone ? 'pointer' : 'default';
    btn.classList.remove('sent');
    doneWrap.style.display = 'none';
  }
}

  S[curProp].staffDate = staffDate;
  const now = new Date();
  const timeStr = now.getHours()+'時'+String(now.getMinutes()).padStart(2,'0')+'分';
  S[curProp].submitted = true;
  S[curProp].submittedAt = timeStr;

  // Googleスプレッドシートに送信
  const prop = P();
  const ps = S[curProp];
  const reqTotal = prop.areas.reduce((s,a)=>s+a.items.filter(it=>!it.o).length,0);
  const reqDone  = prop.areas.reduce((s,a)=>s+a.items.filter((it,i)=>!it.o&&(ps.checked[a.id]||{})[i]).length,0);
  const payload = {
    propName: prop.name,
    staffName: staffName,
    staffDate: staffDate,
    reqDone: reqDone,
    reqTotal: reqTotal,
    submittedAt: timeStr,
    supply: ps.supply||'',
    maint: ps.maint||'',
    memo: ps.memo||''
  };
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  }).catch(err => console.log('送信エラー:', err));

  renderSubmit(); renderPropTabs(); updateCheckSubmitBtn();
}

// HQ
let selectedNoticeProp = PROPS[0].id;

function renderHQ(){
  const sent = PROPS.filter(p=>S[p.id].submitted).length;
  const totalAll = PROPS.reduce((s,p)=>s+p.areas.reduce((ss,a)=>ss+a.items.length,0),0);
  const doneAll  = PROPS.reduce((s,p)=>s+p.areas.reduce((ss,a)=>ss+Object.values(S[p.id].checked[a.id]||{}).filter(Boolean).length,0),0);
  document.getElementById('hq-sent').textContent  = sent+'/'+PROPS.length;
  document.getElementById('hq-prog').textContent  = Math.round(doneAll/totalAll*100)+'%';
  document.getElementById('hq-flags').textContent = sent;

  // notice prop selector
  document.getElementById('notice-prop-select').innerHTML = PROPS.map(p=>`
    <button class="notice-prop-btn${selectedNoticeProp===p.id?' active':''}" onclick="selectNoticeProp('${p.id}')">${p.name}</button>`).join('');

  // existing notices list
  const hasAny = PROPS.some(p=>notices[p.id].text);
  document.getElementById('notice-list').innerHTML = hasAny ? PROPS.filter(p=>notices[p.id].text).map(p=>`
    <div style="background:var(--gold-light);border:1px solid var(--border2);border-radius:var(--radius);padding:13px 14px;margin-bottom:8px;">
      <div style="font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:6px;">${p.name} — 特記事項</div>
      <div style="font-size:13px;color:var(--text);font-weight:300;line-height:1.6;white-space:pre-wrap;">${notices[p.id].text}</div>
      ${notices[p.id].replies.length?`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);">
        <div style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;">返信</div>
        ${notices[p.id].replies.map(r=>`<div style="font-size:12px;color:var(--text2);font-weight:300;padding:4px 0;line-height:1.5;"><span style="color:var(--text3);font-size:10px;">${r.name} ${r.time}　</span>${r.text}</div>`).join('')}
      </div>`:''}
      <button onclick="clearNotice('${p.id}')" style="margin-top:10px;font-size:10px;color:var(--text3);background:none;border:none;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;">削除</button>
    </div>`).join('') : '';

  document.getElementById('hq-cards').innerHTML = PROPS.map((p,pi)=>{
    const ps = S[p.id];
    const total = p.areas.reduce((s,a)=>s+a.items.length,0);
    const done  = p.areas.reduce((s,a)=>s+Object.values(ps.checked[a.id]||{}).filter(Boolean).length,0);
    const pct = Math.round(done/total*100);
    const bc = ps.submitted?'badge-done':pct>0?'badge-prog':'badge-none';
    const bt = ps.submitted?'業務完了 ✓':pct>0?`${pct}%`:'未着手';
    const hasMemo = ps.supply||ps.maint||ps.memo;
    return`<div class="prop-card">
      <div class="prop-card-hd" onclick="toggleHQCard(${pi})">
        <span class="prop-card-name">${p.name}</span>
        ${ps.submitted?`<span class="sent-badge">🏁 ${ps.submittedAt}　${ps.staffName||''}</span>`:''}
        <span class="badge ${bc}">${bt}</span>
        <span class="chev" id="hqchev-${pi}">▼</span>
      </div>
      <div class="prop-card-body" id="hqbody-${pi}">
        ${p.areas.map(a=>{
          const ad=Object.values(ps.checked[a.id]||{}).filter(Boolean).length;
          const at=a.items.length;
          return`<div class="area-rpt-row">
            <span class="area-rpt-name">${a.name}</span>
            <div class="mini-bar"><div class="mini-fill" style="width:${Math.round(ad/at*100)}%"></div></div>
            <span class="area-rpt-pct">${ad}/${at}</span>
          </div>`;
        }).join('')}
        ${hasMemo?`<div class="memo-section">
          ${ps.supply?`<div class="memo-row"><span class="memo-label">補充：</span>${ps.supply}</div>`:''}
          ${ps.maint?`<div class="memo-row"><span class="memo-label">修繕：</span>${ps.maint}</div>`:''}
          ${ps.memo?`<div class="memo-row"><span class="memo-label">メモ：</span>${ps.memo}</div>`:''}
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

function selectNoticeProp(id){
  selectedNoticeProp = id;
  // restore existing text if any
  document.getElementById('notice-txt').value = notices[id].text || '';
  renderHQ();
}
function saveNotice(){
  const txt = document.getElementById('notice-txt').value.trim();
  notices[selectedNoticeProp].text = txt;
  notices[selectedNoticeProp].replies = [];
  document.getElementById('notice-txt').value = '';
  renderHQ();
}
function clearNotice(propId){
  notices[propId] = { text:'', replies:[] };
  renderHQ();
}
function toggleHQCard(idx){
  const body = document.getElementById('hqbody-'+idx);
  const chev = document.getElementById('hqchev-'+idx);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}

document.getElementById('date-lbl').textContent = new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});
